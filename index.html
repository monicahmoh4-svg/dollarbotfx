        <!--
            CRITICAL FIX FOR "Sorry for the interruption":
            1. Unregisters ALL stale service workers from previous deploys.
            2. Deletes ALL caches so old JS chunks can never be served.
            3. Blocks the PWA service worker from re-registering.
            4. Auto-reloads ONCE if a chunk-loading error is ever detected.
            This runs before the app modules load.
        -->
        <script>
            (function () {
                // 1 + 2: Remove stale service workers and caches immediately.
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker
                        .getRegistrations()
                        .then(function (registrations) {
                            registrations.forEach(function (registration) {
                                registration.unregister();
                            });
                        })
                        .catch(function () {});
                }

                if ('caches' in window) {
                    caches
                        .keys()
                        .then(function (keys) {
                            keys.forEach(function (key) {
                                caches.delete(key);
                            });
                        })
                        .catch(function () {});
                }

                // 3: Block re-registration so stale shells can never return.
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register = function () {
                        console.log('[HTML] Service worker registration blocked for stability.');
                        return Promise.resolve(null);
                    };
                }

                // 4: Self-heal if a stale chunk ever slips through.
                window.addEventListener('error', function (event) {
                    var msg = String((event && event.message) || '');
                    var isChunkError =
                        msg.indexOf('Loading chunk') !== -1 ||
                        msg.indexOf('ChunkLoadError') !== -1 ||
                        msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
                        msg.indexOf('error loading dynamically imported module') !== -1 ||
                        msg.indexOf('Unable to preload CSS') !== -1;

                    if (isChunkError) {
                        try {
                            if (!sessionStorage.getItem('dbfx_chunk_reload_done')) {
                                sessionStorage.setItem('dbfx_chunk_reload_done', '1');
                                window.location.reload();
                            }
                        } catch (e) {}
                    }
                });

                window.addEventListener('load', function () {
                    setTimeout(function () {
                        try {
                            sessionStorage.removeItem('dbfx_chunk_reload_done');
                        } catch (e) {}
                    }, 5000);
                });
            })();
        </script>
