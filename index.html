        <style>
            :root { font-size: 62.5%; }
            body { color-scheme: light !important; background-color: #ffffff !important; }
            body.theme--dark { background-color: #ffffff !important; color: #111827 !important; }
            #root { max-width: 100vw; overflow-x: hidden; }
            #ai-bot-root { position: fixed; z-index: 99999; pointer-events: none; font-size: 16px !important; line-height: 1.4 !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; }
            #ai-bot-root > * { pointer-events: auto; }
        </style>
        <script>
            (function () {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function (registrations) {
                        registrations.forEach(function (registration) { registration.unregister(); });
                    }).catch(function () {});
                }
                if ('caches' in window) {
                    caches.keys().then(function (keys) { keys.forEach(function (key) { caches.delete(key); }); }).catch(function () {});
                }
                window.addEventListener('error', function (event) {
                    var msg = String((event && event.message) || '');
                    if (msg.indexOf('Loading chunk') !== -1 || msg.indexOf('ChunkLoadError') !== -1) {
                        if (!sessionStorage.getItem('dbfx_chunk_reload_done')) {
                            sessionStorage.setItem('dbfx_chunk_reload_done', '1');
                            window.location.reload();
                        }
                    }
                });
            })();
        </script>
