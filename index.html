<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <!--
            ROOT FIX:
            This viewport configuration is required to stop mobile/desktop
            browsers from rendering the app in a zoomed-out or oversized mode.
        -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />

        <!-- Force light theme baseline -->
        <meta name="color-scheme" content="light" />
        <meta name="theme-color" content="#ffffff" />

        <title>DollarBotFX</title>

        <style>
            /* ============================================================= */
            /* ROOT ZOOM / FIT FIX                                           */
            /* ============================================================= */

            html {
                zoom: 1 !important;
                -webkit-text-size-adjust: 100% !important;
                text-size-adjust: 100% !important;
                font-size: 16px !important;
                scroll-behavior: smooth;
            }

            body {
                margin: 0 !important;
                padding: 0 !important;
                width: 100vw !important;
                min-width: 100vw !important;
                max-width: 100vw !important;
                min-height: 100vh;
                min-height: 100dvh;
                overflow-x: hidden !important;
                background-color: #ffffff !important;
                color: #111827 !important;
                font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    "Helvetica Neue",
                    Arial,
                    sans-serif;
                font-size: 14px;
                line-height: 1.45;
                -webkit-font-smoothing: antialiased;
                text-rendering: optimizeLegibility;
            }

            #root {
                width: 100vw !important;
                min-width: 100vw !important;
                max-width: 100vw !important;
                min-height: 100vh;
                min-height: 100dvh;
                margin: 0 !important;
                padding: 0 !important;
                overflow-x: hidden !important;
                overflow-y: auto !important;
                background-color: #ffffff !important;
                position: relative;
            }

            #root > * {
                width: 100% !important;
                max-width: 100vw !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
                min-width: 0 !important;
            }

            /*
                Prevent any inner fixed-width panel, Blockly container,
                chart container, canvas, SVG, table, or inline-styled element
                from forcing horizontal overflow.
            */
            #root * {
                box-sizing: border-box;
                min-width: 0;
                max-width: 100%;
            }

            #root [style*="width:"],
            #root [style*="width: "] {
                max-width: 100vw !important;
            }

            #root [style*="height:"],
            #root [style*="height: "] {
                max-height: 100dvh;
            }

            img,
            video,
            iframe,
            svg,
            canvas {
                max-width: 100% !important;
            }

            img,
            video,
            iframe {
                height: auto;
            }

            canvas {
                display: block;
            }

            /* ============================================================= */
            /* GLOBAL RESPONSIVE APP SHELL                                   */
            /* ============================================================= */

            :where(
                .app,
                .main,
                .dashboard,
                .content,
                .container,
                .page,
                main,
                section,
                header,
                footer,
                aside,
                nav
            ) {
                width: 100% !important;
                max-width: 100vw !important;
                min-width: 0 !important;
                margin-left: auto !important;
                margin-right: auto !important;
            }

            :where(.dashboard, .main, .content, .page, main) {
                padding: clamp(8px, 2vw, 18px) !important;
                overflow-x: hidden;
            }

            /* ============================================================= */
            /* DASHBOARD / PANEL UI IMPROVEMENT                              */
            /* ============================================================= */

            :where(
                .card,
                .panel,
                .widget,
                .box,
                .summary-card,
                .dashboard-card,
                .run-panel,
                .transactions,
                .journal,
                .toolbox,
                .chart-panel,
                .settings-panel,
                .bot-panel
            ) {
                background: linear-gradient(180deg, #ffffff, #fbfdff);
                border: 1px solid #e5e7eb;
                border-radius: 14px;
                box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
                padding: 14px;
                min-width: 0;
                overflow: hidden;
                animation: aiFadeIn 0.25s ease both;
                transition:
                    transform 0.18s ease,
                    box-shadow 0.18s ease,
                    border-color 0.18s ease;
            }

            :where(
                .card,
                .panel,
                .widget,
                .dashboard-card,
                .summary-card
            ):hover {
                transform: translateY(-2px);
                box-shadow: 0 18px 50px rgba(15, 23, 42, 0.14);
                border-color: #dbeafe;
            }

            /* Improved dashboard grid if these classes exist */
            :where(.dashboard, .dashboard-grid, .main-dashboard) {
                display: grid;
                gap: 12px;
                grid-template-columns: 1fr;
                align-items: start;
                width: 100% !important;
            }

            @media (min-width: 768px) {
                :where(.dashboard, .dashboard-grid, .main-dashboard) {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
            }

            @media (min-width: 1280px) {
                :where(.dashboard, .dashboard-grid, .main-dashboard) {
                    grid-template-columns: repeat(12, minmax(0, 1fr));
                }

                :where(.dashboard, .dashboard-grid, .main-dashboard) > * {
                    grid-column: span 12;
                }

                :where(.dashboard, .dashboard-grid, .main-dashboard)
                    > :where(.sidebar, .toolbox, .left-panel) {
                    grid-column: span 3;
                }

                :where(.dashboard, .dashboard-grid, .main-dashboard)
                    > :where(.main-panel, .chart-panel, .workspace, .blockly-panel) {
                    grid-column: span 6;
                }

                :where(.dashboard, .dashboard-grid, .main-dashboard)
                    > :where(
                        .run-panel,
                        .summary-panel,
                        .right-panel,
                        .transactions,
                        .journal
                    ) {
                    grid-column: span 3;
                }
            }

            /* ============================================================= */
            /* HEADER / TOOLBAR                                              */
            /* ============================================================= */

            :where(.header, .topbar, .toolbar, .navbar, nav) {
                width: 100% !important;
                max-width: 100vw !important;
                min-width: 0 !important;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                padding: 10px 12px;
                background: rgba(255, 255, 255, 0.88);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border-bottom: 1px solid rgba(229, 231, 235, 0.9);
                position: sticky;
                top: 0;
                z-index: 50;
                animation: aiFadeIn 0.2s ease both;
            }

            /* ============================================================= */
            /* BLOCKLY / CHART / CANVAS FIT FIX                              */
            /* ============================================================= */

            :where(
                .blocklyDiv,
                .injectionDiv,
                .blocklyArea,
                .chart-container,
                .chart,
                .trading-chart,
                .chart-wrapper
            ) {
                width: 100% !important;
                max-width: 100vw !important;
                min-width: 0 !important;
                border-radius: 12px;
                overflow: auto;
            }

            .blocklyDiv,
            .injectionDiv,
            .blocklyArea {
                height: min(75vh, 900px) !important;
                min-height: 320px;
            }

            .blocklyToolboxDiv,
            .blocklyTree,
            .flyout,
            .toolbox {
                max-width: 100%;
                overflow: auto;
            }

            .blocklySvg {
                max-width: 100%;
                height: auto;
            }

            .chart-container canvas,
            .trading-chart canvas,
            .chart canvas {
                width: 100% !important;
                height: 100% !important;
                min-height: 280px;
            }

            /* ============================================================= */
            /* TABLES                                                        */
            /* ============================================================= */

            table {
                width: 100% !important;
                max-width: 100% !important;
                border-collapse: collapse;
                display: block;
                overflow-x: auto;
                border-radius: 12px;
            }

            th,
            td {
                padding: 8px 10px;
                border-bottom: 1px solid #e5e7eb;
                white-space: nowrap;
                font-size: 13px;
            }

            tr:hover td {
                background: #f9fafb;
            }

            /* ============================================================= */
            /* INPUTS / BUTTONS                                              */
            /* ============================================================= */

            input,
            select,
            textarea {
                border-radius: 10px;
                border: 1px solid #d1d5db;
                background: #ffffff;
                color: #111827;
                padding: 8px 10px;
                outline: none;
                max-width: 100%;
                transition:
                    border-color 0.15s ease,
                    box-shadow 0.15s ease;
            }

            input:focus,
            select:focus,
            textarea:focus {
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            }

            button,
            .btn {
                border-radius: 10px;
                transition:
                    transform 0.15s ease,
                    opacity 0.15s ease,
                    box-shadow 0.15s ease;
            }

            button:hover,
            .btn:hover {
                transform: translateY(-1px);
            }

            button:active,
            .btn:active {
                transform: translateY(0) scale(0.99);
            }

            /* ============================================================= */
            /* SCROLLBAR                                                     */
            /* ============================================================= */

            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            ::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 999px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }

            /* ============================================================= */
            /* AI BOT FLOATING MOUNT                                         */
            /* ============================================================= */

            #ai-bot-root {
                position: fixed;
                right: max(16px, env(safe-area-inset-right));
                bottom: max(16px, env(safe-area-inset-bottom));
                z-index: 2147483647;
                pointer-events: none;
            }

            #ai-bot-root > * {
                pointer-events: auto;
            }

            /* ============================================================= */
            /* ANIMATIONS                                                    */
            /* ============================================================= */

            @keyframes aiFadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            @keyframes aiSlideUp {
                from {
                    opacity: 0;
                    transform: translateY(16px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes aiPulse {
                0% {
                    box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.3);
                }
                100% {
                    box-shadow: 0 0 0 18px rgba(37, 99, 235, 0);
                }
            }

            /* ============================================================= */
            /* MOBILE FIT                                                    */
            /* ============================================================= */

            @media (max-width: 767px) {
                body {
                    font-size: 13px;
                }

                :where(.dashboard, .main, .content, .page, main) {
                    padding: 8px !important;
                }

                :where(
                    .card,
                    .panel,
                    .widget,
                    .box,
                    .summary-card,
                    .dashboard-card
                ) {
                    padding: 10px;
                    border-radius: 12px;
                }

                table th,
                table td {
                    padding: 6px 8px;
                    font-size: 12px;
                }

                .blocklyDiv,
                .injectionDiv,
                .blocklyArea {
                    height: min(65vh, 700px) !important;
                    min-height: 260px;
                }
            }

            /* ============================================================= */
            /* ACCESSIBILITY                                                 */
            /* ============================================================= */

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>

        <!--
            ROOT FIT SCRIPT:
            This forces the document zoom and root width to normalize
            immediately on load and on resize.
        -->
        <script>
            (function () {
                function normalizeAppFit() {
                    var documentElement = document.documentElement;

                    if (documentElement) {
                        documentElement.style.setProperty('zoom', '1');
                        documentElement.style.setProperty(
                            '-webkit-text-size-adjust',
                            '100%'
                        );
                        documentElement.style.setProperty('text-size-adjust', '100%');

                        if (window.innerWidth < 768) {
                            documentElement.style.fontSize = '14px';
                        } else {
                            documentElement.style.fontSize = '16px';
                        }
                    }

                    var root = document.getElementById('root');

                    if (root) {
                        root.style.width = '100%';
                        root.style.maxWidth = '100vw';
                        root.style.margin = '0';
                        root.style.padding = '0';
                    }
                }

                window.addEventListener('DOMContentLoaded', normalizeAppFit);
                window.addEventListener('load', normalizeAppFit);
                window.addEventListener('resize', normalizeAppFit);
            })();
        </script>
    </head>

    <body>
        <!-- Main React app mount point -->
        <div id="root"></div>

        <!-- AI Bot mount point -->
        <div id="ai-bot-root"></div>

        <!-- Main application entry -->
        <script type="module" src="/src/main.tsx"></script>

        <!-- AI Bot launcher / floating button / popup -->
        <script type="module" src="/src/ai/install-ai-bot.tsx"></script>

        <!--
            AI BUTTON FALLBACK:
            If the React AI button fails to mount, this guarantees that a
            floating AI button is still visible.
        -->
        <script>
            window.addEventListener('load', function () {
                setTimeout(function () {
                    var aiMount = document.getElementById('ai-bot-root');

                    if (!aiMount) {
                        return;
                    }

                    if (aiMount.childElementCount === 0) {
                        var fallbackButton = document.createElement('button');

                        fallbackButton.textContent = 'AI Bot';
                        fallbackButton.type = 'button';

                        fallbackButton.style.position = 'fixed';
                        fallbackButton.style.right = '16px';
                        fallbackButton.style.bottom = '16px';
                        fallbackButton.style.zIndex = '2147483647';
                        fallbackButton.style.border = 'none';
                        fallbackButton.style.borderRadius = '999px';
                        fallbackButton.style.padding = '12px 16px';
                        fallbackButton.style.background =
                            'linear-gradient(135deg, #2563eb, #7c3aed)';
                        fallbackButton.style.color = '#ffffff';
                        fallbackButton.style.fontWeight = '900';
                        fallbackButton.style.fontSize = '14px';
                        fallbackButton.style.boxShadow =
                            '0 12px 30px rgba(37, 99, 235, 0.35)';
                        fallbackButton.style.cursor = 'pointer';

                        fallbackButton.onclick = function () {
                            alert(
                                'AI Bot UI is not mounted yet. Please ensure src/ai/install-ai-bot.tsx and the AI engine files exist in the repository.'
                            );
                        };

                        aiMount.appendChild(fallbackButton);
                    }
                }, 3000);
            });
        </script>
    </body>
</html>
