        <style>
            /* 
               CRITICAL LAYOUT FIX: 
               Deriv Bot uses a rem-based layout where 1rem = 10px.
               DO NOT change this to 100% or 16px, or the entire 
               dashboard, Blockly workspace, and panels will double 
               in size and overflow the screen!
            */
            :root {
                font-size: 62.5%;
            }

            /* FORCE LIGHT THEME */
            body {
                color-scheme: light !important;
                background-color: #ffffff !important;
            }

            body.theme--dark {
                /* Override any accidental dark theme injection */
                --core-color-primary: #ff444f !important;
                background-color: #ffffff !important;
                color: #111827 !important;
            }

            /* Ensure the main root doesn't overflow horizontally */
            #root {
                max-width: 100vw;
                overflow-x: hidden;
            }

            /* 
               AI BOT CONTAINER ISOLATION:
               Lock the AI mount point to standard 16px so the AI 
               modal and button don't inherit the tiny 10px base 
               from the Deriv Bot layout.
            */
            #ai-bot-root {
                position: fixed;
                z-index: 99999;
                pointer-events: none;
                font-size: 16px !important;
                line-height: 1.4 !important;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
            }

            #ai-bot-root > * {
                pointer-events: auto;
            }
        </style>

        <!-- Browser Service Worker Prevention -->
        <script>
            const userAgent = navigator.userAgent.toLowerCase();
            const isFirefox = userAgent.includes('firefox');
            const isSafari = userAgent.includes('safari') && !userAgent.includes('chrome');
            const shouldSkipSW = isFirefox || isSafari;
            if (shouldSkipSW) {
                const browserName = isFirefox ? 'Firefox' : 'Safari';
                console.log(
                    `[HTML] ${browserName} detected - preventing service worker registration to avoid chunk loading issues`
                );
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker
                        .getRegistrations()
                        .then(registrations => {
                            registrations.forEach(registration => {
                                console.log(`[HTML] Unregistering existing SW for ${browserName}:`, registration.scope);
                                registration.unregister();
                            });
                        })
                        .catch(error => {
                            console.error('[HTML] Failed to cleanup service workers:', error);
                        });
                }
            }

            console.log('[HTML] Online status:', navigator.onLine);
            window.addEventListener('online', () => {
                console.log('[HTML] Back online');
            });
            window.addEventListener('offline', () => {
                console.log('[HTML] Gone offline');
            });

            if ('serviceWorker' in navigator && !shouldSkipSW) {
                navigator.serviceWorker.addEventListener('message', event => {
                    console.log('[HTML] Message from service worker:', event.data);
                });
            }
        </script>
    </body>
