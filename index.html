        <script>
            (function () {
                // Kill stale service workers and caches from previous deploys.
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker
                        .getRegistrations()
                        .then(function (registrations) {
                            registrations.forEach(function (registration) {
                                registration.unregister();
                            });
                        })
                        .catch(function () {});
                }

                if ('caches' in window) {
                    caches
                        .keys()
                        .then(function (keys) {
                            keys.forEach(function (key) {
                                caches.delete(key);
                            });
                        })
                        .catch(function () {});
                }

                // If a stale-chunk error escapes to window level, hard-refresh once.
                window.addEventListener('error', function (event) {
                    var msg = String((event && event.message) || '');
                    var isChunkError =
                        msg.indexOf('Loading chunk') !== -1 ||
                        msg.indexOf('ChunkLoadError') !== -1 ||
                        msg.indexOf("reading 'call'") !== -1 ||
                        msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
                        msg.indexOf('Unable to preload CSS') !== -1;

                    if (isChunkError) {
                        try {
                            if (!sessionStorage.getItem('dbfx_chunk_reload_done')) {
                                sessionStorage.setItem('dbfx_chunk_reload_done', '1');
                                var url = new URL(window.location.href);
                                url.searchParams.set('cb', String(Date.now()));
                                window.location.replace(url.toString());
                            }
                        } catch (e) {}
                    }
                });

                window.addEventListener('load', function () {
                    setTimeout(function () {
                        try {
                            sessionStorage.removeItem('dbfx_chunk_reload_done');
                        } catch (e) {}
                    }, 5000);
                });
            })();
        </script>

    <body class="body theme theme--light">
        <div id="modal_root" class="modal-root"></div>

        <div id="root"></div>

        <!--
            NOTE: Do not add extra `<script type="module" src="/src/...">` tags here.
            Rsbuild only compiles the entry declared in rsbuild.config.ts
            (source.entry -> ./src/main.tsx) and automatically injects the correct
            bundled/hashed <script> tags into <head> at build time. Any other raw
            `/src/*.tsx` script tag added directly to this file will work in `npm run dev`
            (which compiles TSX on the fly) but does NOT exist in the production `dist/`
            output, will 404 in production, and — combined with vercel.json's SPA
            catch-all rewrite — will get served index.html's own markup back as if it
            were a JS module. That corrupts the already-running app bundle and is what
            was causing "Cannot read properties of undefined (reading 'call')".

            To add new mounted UI (e.g. the AI Bot / Free Bots widgets), import and
            render the component from inside the existing React tree (e.g. in
            src/app/app-content.jsx) instead of adding a new script tag here.
        -->
